services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    container_name: chatrooms_app
    ports:
      - '3000:3000'
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    container_name: postgres
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./api/.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
